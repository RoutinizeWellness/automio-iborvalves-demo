<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1d2127;--mut:#6b7280;--line:#e3e5e9;--acc:#1f4fd8;--ok:#177245;--warn:#a85d00;--bad:#b3261e}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;min-height:100vh}
nav{width:216px;background:#fff;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;flex:none;display:flex;flex-direction:column}
.brand{padding:2px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}.brand img{max-width:140px;max-height:44px;display:block}.brand small{display:block;color:var(--mut);font-size:11.5px;margin-top:8px}
nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;font:inherit;color:#444b55;cursor:pointer}
nav button:hover{background:#f3f4f6}nav button.on{background:#e8eefc;color:var(--acc);font-weight:600}nav .n{font-size:11px;background:#fdecc8;color:var(--warn);border-radius:99px;padding:0 7px}
.by{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);display:flex;gap:8px;align-items:center}.by img{height:18px}
main{flex:1;padding:22px 26px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}h2{margin:0;font-size:19px}p.sub{color:var(--mut);margin:3px 0 0}
.tag{font-size:11.5px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:auto}
table{width:100%;border-collapse:collapse}th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line)}th{white-space:nowrap}th{font-size:11.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;background:#fafbfc;border-top:0}
tbody tr.c{cursor:pointer}tbody tr.c:hover{background:#f7f9ff}td.w{white-space:normal}
.pill{font-size:11.5px;padding:2px 8px;border-radius:4px;background:#eceef1;color:#555;white-space:nowrap;font-weight:500}.pill.ok{background:#e0f2e7;color:var(--ok)}.pill.w{background:#fdecc8;color:var(--warn)}.pill.b{background:#fbe2df;color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}.kpi b{font-size:24px;display:block}.kpi span{color:var(--mut);font-size:12.5px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.src{padding:14px 16px;font-size:13px;line-height:1.6}.src .h{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:8px}
.cert{border:1px solid #cfd3da;padding:12px 14px;background:#fcfcfd;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
mark{background:#fff0a8;padding:0 2px;border-radius:2px}mark.sel{outline:2px solid var(--acc)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line)}.ck:first-child{border-top:0}.ck .i{width:18px;height:18px;border-radius:50%;flex:none;margin-top:1px;text-align:center;font-size:11px;line-height:18px;color:#fff}.i.ok{background:var(--ok)}.i.b{background:var(--bad)}.i.w{background:var(--warn)}
.ck .m{color:var(--mut);font-size:12.5px}.ck.cl{cursor:pointer}.ck.cl:hover{background:#f7f9ff}
.bar{display:flex;gap:8px;justify-content:flex-end;padding:12px 14px;border-top:1px solid var(--line);background:#fafbfc}
.btn{border:1px solid #cfd3da;background:#fff;padding:7px 13px;border-radius:6px;font:inherit;cursor:pointer}.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}.btn:disabled{opacity:.5;cursor:default}
.back{color:var(--acc);cursor:pointer;display:inline-block;margin-bottom:8px}.empty{padding:22px;color:var(--mut);text-align:center}
.draft{padding:12px 14px;white-space:pre-wrap;font-size:13.5px;border:1px solid var(--line);margin:10px 14px;border-radius:6px;background:#fafbfc}
.m{color:var(--mut);font-size:12.5px}.note{padding:10px 14px;background:#fffaf0;border-top:1px solid var(--line);font-size:12.5px;color:#6b4a00}
@media(max-width:820px){body{display:block}nav{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;gap:4px;padding:10px}.brand{border:0;margin:0;padding:0 8px;width:100%}nav button{width:auto}.by{display:none}.kpis{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}main{padding:16px}}

.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.sec{padding:12px 14px 6px;font-weight:600;font-size:13px}.fl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar2{height:6px;background:#eceef1;border-radius:3px;overflow:hidden;min-width:70px}.bar2 i{display:block;height:100%;background:var(--ok)}.bar2 i.w{background:var(--warn)}.bar2 i.b{background:var(--bad)}
.src2{padding:10px 14px;font-size:12px;color:var(--mut);border-top:1px solid var(--line);background:#fafbfc}.src2 a{color:var(--acc)}
.tl{padding:6px 14px 12px}.tl div{display:flex;gap:10px;padding:5px 0;font-size:13px}.tl time{color:var(--mut);width:72px;flex:none}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;padding:12px 14px;font-size:13px}.kv span{color:var(--mut)}
@media(max-width:820px){.two{grid-template-columns:1fr}.kv{grid-template-columns:110px 1fr}}
</style></head><body>

const R=[

];

const VAL={
 title:"Válvula de bola 6\" 600# · trunnion, entrada lateral, asiento blando · servicio ácido (NACE MR0175)",pc:"PC-26-081 · nº de serie 26-081-07 (ejemplo)",
 parts:[
 ["Cuerpo","A105","S1","41872","3.1 ok","PMI ok","ok"],

 ["Bola","F316L + ENP","S2","B55120","3.1 ok","PMI ok","w"],
 ["Vástago","F6a","S5","T-1904","Tratamiento: informe pendiente","Dureza pendiente","b"],
 ["Asientos","PTFE reforzado","S8","J-0733","Conformidad recibida","No aplica","ok"],
 ["Espárragos","B7M","S9","T-2208","3.1 ok","Dureza fuera de límite","b"],
 ["Juntas","Grafito","S8","J-0735","Conformidad recibida","No aplica","ok"]]};
let S={v:"home",open:null,f:"Todos",draft:[],sent:{},rec:null,sup:null};
const $=s=>document.querySelector(s),M=$("#m");
const pend=()=>O.filter(o=>o.st!="ok"&&!o.done);
const V=[["home","Resumen"],["conf","Confirmaciones",()=>pend().length],["rec","Recepción",()=>R.filter(r=>r.res!="ok"&&!r.ok).length],["tra","Trazabilidad"],["ord","Pedidos de compra"],["sup","Proveedores"],["dr","Borradores",()=>S.draft.length]];
function nav(v,x){S.v=v;S.open=x==null?null:x;S.sup=null;draw()}
function draw(){$("#nv").innerHTML=V.map(([k,l,f])=>`<button class="${S.v==k?"on":""}" onclick="nav('${k}')">${l}${f&&f()?`<span class="n">${f()}</span>`:""}</button>`).join("");({home,conf,rec,tra,ord,sup,dr})[S.v]();window.scrollTo(0,0)}
const pill=o=>o.done?'<span class="pill ok">Revisado</span>':`<span class="pill ${PC[o.st]}">${L[o.st]}</span>`;
const sn=k=>SUP[k].n;
const head=(t,s,tag)=>`<div class="top"><div><h2>${t}</h2><p class="sub">${s}</p></div><span class="tag">${tag||"Datos ficticios"}</span></div>`;
function checks(o){const r=[];
r.push([o.dConf==o.dReq?"ok":"w","Fecha de entrega",`Pedida ${o.dReq} · confirmada ${o.dConf}`]);
r.push([o.qConf==o.qty?"ok":"w","Cantidad",`Pedida ${o.qty} · confirmada ${o.qConf}`]);
if(o.mat!="—")r.push([o.mat==o.matConf?"ok":"b","Material",`Pedido ${o.mat} · confirmado ${o.matConf}`+(o.mat!=o.matConf?(o.mat=="B7M"?" (B7 no vale para servicio ácido)":" (no es el mismo grado)"):"")]);
if(o.cert!="na")r.push([o.cert=="pend"?"w":"ok","Certificado EN 10204 3.1",o.cert=="pend"?"Aún no recibido. Se pide antes de dar entrada":"Recibido con colada legible"]);
return r}
function home(){const p=pend(),rb=R.filter(r=>r.res!="ok"&&!r.ok);M.innerHTML=head("Compras y calidad · IBOR Valves","Confirmaciones de proveedor, certificados de material y trazabilidad por válvula, en un solo sitio.")+
`<div class="kpis"><div class="kpi"><b>${O.length}</b><span>pedidos de compra abiertos</span></div><div class="kpi"><b>${p.length}</b><span>confirmaciones por revisar</span></div><div class="kpi"><b>${rb.length}</b><span>lotes con reserva o retenidos</span></div><div class="kpi"><b>${VAL.parts.filter(x=>x[6]=="b").length}</b><span>componentes que bloquean una válvula</span></div></div>
<div class="two"><div class="card"><div class="sec">Hoy toca mirar</div><table><tbody>${p.map(o=>`<tr class="c" onclick="nav('conf',${O.indexOf(o)})"><td><b>${o.po}</b></td><td class="w">${sn(o.s)}</td><td class="w">${checks(o).filter(c=>c[0]!="ok").map(c=>c[1]).join(", ")}</td><td>${pill(o)}</td></tr>`).join("")||'<tr><td class="empty">Todo revisado.</td></tr>'}${rb.map(r=>`<tr class="c" onclick="nav('rec')"><td><b>${r.id}</b></td><td class="w">${sn(r.s)}</td><td class="w">${r.what}</td><td><span class="pill ${RC[r.res][0]}">${RC[r.res][1]}</span></td></tr>`).join("")}</tbody></table></div>
<div class="card"><div class="sec">Qué cuida cada módulo</div><div class="ck"><span class="i ok">1</span><div><b>Confirmaciones</b><div class="m">Lee el correo, WhatsApp o PDF del proveedor y lo compara con el pedido.</div></div></div><div class="ck"><span class="i ok">2</span><div><b>Recepción</b><div class="m">Control de entrada: certificado 3.1, colada, composición, dureza, marcado.</div></div></div><div class="ck"><span class="i ok">3</span><div><b>Trazabilidad</b><div class="m">Dossier por válvula con la colada de cada pieza que retiene presión.</div></div></div></div></div>
<div class="src2">Contexto de IBOR (iborvalves.com): válvulas de bola forjadas, material europeo mayoritariamente español, doble trazabilidad, marcado permanente en las piezas que retienen presión, ISO 9001:2015, API 6D, PED 2014/68/UE módulo H1.</div>`}
function conf(){if(S.open!=null)return rev(S.open);const fs=["Todos","Con diferencias","Sin diferencias"];let X=O.filter(o=>S.f=="Todos"||(S.f=="Con diferencias")==(o.st!="ok"));
M.innerHTML=head("Confirmaciones","Cada confirmación se lee y se compara con el pedido de compra.")+`<div class="fl">${fs.map(f=>`<span class="chip ${S.f==f?"on":""}" onclick="S.f='${f}';draw()">${f}</span>`).join("")}</div><div class="card"><table><thead><tr><th>Pedido</th><th>Proveedor</th><th>Artículo</th><th>Canal</th><th>Recibida</th><th>Estado</th></tr></thead><tbody>${X.map(o=>`<tr class="c" onclick="nav('conf',${O.indexOf(o)})"><td><b>${o.po}</b></td><td>${sn(o.s)}</td><td>${o.item}</td><td>${o.ch}</td><td>${o.when}</td><td>${pill(o)}</td></tr>`).join("")}</tbody></table></div>`}

function msg(o){const t={m:o.mat=="B7M"?`confirmáis calidad B7 y el pedido es B7M para servicio ácido (NACE MR0175). Necesitamos B7M con certificado 3.1, o que nos digáis por escrito qué podéis servir y cuándo.`:`el material confirmado (${o.matConf}) no coincide con el pedido (${o.mat}). Necesitamos confirmar por escrito si podéis suministrar ${o.mat} en la fecha pedida, con certificado 3.1.`,d:`la fecha confirmada (${o.dConf}) es posterior a la pedida (${o.dReq}). ¿Podéis adelantar alguna parte? Si no, confirmadnos la fecha definitiva.`,q:`confirmáis ${o.qConf} de ${o.qty} unidades. ¿Qué día llegan las ${o.qty-o.qConf} restantes?`,c:`falta el informe de tratamiento y las durezas. Los necesitamos antes de dar entrada al lote, con la colada de cada vástago.`}[o.st];return `Hola,\n\nSobre el pedido ${o.po} (${o.item}): ${t}\n\nGracias.\nCompras · IBOR Valves`}
function msgR(r){const bad=r.ck.filter(x=>x[0]!="ok").map(x=>`${x[1]}: ${x[2]}`).join("\n- ");return `Hola,\n\nSobre el lote ${r.id} (${r.what}, colada ${r.heat}) del pedido ${r.oc}, en el control de entrada hemos visto:\n- ${bad}\n\nNecesitamos vuestra respuesta y, si procede, certificado corregido o reposición antes de usar el material.\n\nGracias.\nCalidad · IBOR Valves`}
function rec(){if(S.rec!=null)return recd(S.rec);M.innerHTML=head("Recepción y certificados","Control de entrada de cada lote antes de pasarlo a fabricación.")+`<div class="card"><table><thead><tr><th>Lote</th><th>Pedido</th><th>Proveedor</th><th>Material</th><th>Colada</th><th>Control</th></tr></thead><tbody>${R.map((r,i)=>`<tr class="c" onclick="S.rec=${i};draw()"><td><b>${r.id}</b></td><td>${r.oc}</td><td>${sn(r.s)}</td><td>${r.what}</td><td>${r.heat}</td><td><span class="pill ${RC[r.res][0]}">${RC[r.res][1]}</span></td></tr>`).join("")}</tbody></table></div><div class="src2">El control de entrada refleja lo que IBOR publica sobre su calidad: material identificado y controlado en recepción, doble trazabilidad y análisis PMI. Los resultados de cada lote son inventados.</div>`}
function recd(i){const r=R[i];M.innerHTML=`<span class="back" onclick="S.rec=null;draw()">← Recepción</span>`+head(r.id+" · "+r.what,sn(r.s)+" · pedido "+r.oc+" · certificado "+r.cert)+`<div class="card">${r.ck.map(x=>`<div class="ck"><span class="i ${x[0]}">${x[0]=="ok"?"✓":"!"}</span><div><b>${x[1]}</b><div class="m">${x[2]}</div></div></div>`).join("")}<div class="bar"><button class="btn" onclick="S.rec=null;draw()">Volver</button>${r.res!="ok"?`<button class="btn" onclick="mkr(${i})">Preparar mensaje al proveedor</button>`:""}<button class="btn p" onclick="r=R[${i}];r.ok=true;S.rec=null;draw()">${r.res=="b"?"Confirmar retención":"Dar entrada"}</button></div></div>`}
function tra(){const bad=VAL.parts.filter(x=>x[6]=="b").length;M.innerHTML=head("Trazabilidad por válvula","Cada pieza que retiene presión se liga a su colada, certificado y ensayo antes de pasar a prueba.")+
`<div class="card"><div class="kv"><span>Válvula</span><b>${VAL.title}</b><span>Pedido / serie</span><div>${VAL.pc}</div><span>Estado del dossier</span><div><span class="pill ${bad?"b":"ok"}">${bad?"No liberar a prueba hidrostática":"Completo"}</span></div></div></div>
<div class="card"><table><thead><tr><th>Pieza</th><th>Material</th><th>Proveedor</th><th>Colada</th><th>Certificado</th><th>Ensayo</th><th></th></tr></thead><tbody>${VAL.parts.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${sn(x[2])}</td><td>${x[3]}</td><td>${x[4]}</td><td>${x[5]}</td><td><span class="pill ${x[6]}">${{ok:"Correcto",w:"Con reserva",b:"Bloquea"}[x[6]]}</span></td></tr>`).join("")}</tbody></table></div>
<div class="card"><div class="sec">Pruebas previstas antes de expedir (según IBOR)</div><div class="ck"><span class="i w">·</span><div><b>Prueba hidrostática</b><div class="m">Hasta 800 bar. Bloqueada hasta cerrar el dossier de piezas.</div></div></div><div class="ck"><span class="i w">·</span><div><b>Prueba de gas a alta presión</b><div class="m">Con nitrógeno o helio.</div></div></div><div class="ck"><span class="i w">·</span><div><b>Ensayos no destructivos</b><div class="m">Partículas magnéticas, líquidos penetrantes, radiografía y PMI según pedido.</div></div></div></div>
<div class="src2">Fuente de los ensayos: iborvalves.com/markets/quality. Las piezas, coladas y resultados de este dossier son un ejemplo inventado.</div>`}
function ord(){M.innerHTML=head("Pedidos de compra","Pedidos abiertos, ligados al pedido de cliente que los origina.")+`<div class="card"><table><thead><tr><th>Pedido</th><th>Proveedor</th><th>Artículo</th><th>Cant.</th><th>Entrega pedida</th><th>Confirmada</th><th>Cliente</th><th>Estado</th></tr></thead><tbody>${O.map((o,i)=>`<tr class="c" onclick="nav('conf',${i})"><td><b>${o.po}</b></td><td>${sn(o.s)}</td><td>${o.item}</td><td>${o.qty}</td><td>${o.dReq}</td><td>${o.dConf}</td><td>${o.pc}</td><td>${pill(o)}</td></tr>`).join("")}</tbody></table></div>`}
function sup(){if(S.sup){const k=S.sup,s=SUP[k];M.innerHTML=`<span class="back" onclick="S.sup=null;draw()">← Proveedores</span>`+head(s.n,s.t+" · plazo habitual "+s.lead+" días (ejemplo)")+`<div class="kpis"><div class="kpi"><b>${s.ot} %</b><span>entregas a tiempo</span></div><div class="kpi"><b>${s.rej} %</b><span>rechazo en recepción</span></div><div class="kpi"><b>${s.doc} %</b><span>certificados completos a la primera</span></div><div class="kpi"><b>${O.filter(o=>o.s==k).length}</b><span>pedidos abiertos</span></div></div><div class="card"><table><tbody>${O.filter(o=>o.s==k).map(o=>`<tr class="c" onclick="nav('conf',${O.indexOf(o)})"><td><b>${o.po}</b></td><td>${o.item}</td><td>${pill(o)}</td></tr>`).join("")||'<tr><td class="empty">Sin pedidos abiertos.</td></tr>'}</tbody></table></div><div class="src2">Cifras de ejemplo inventadas para la demo.</div>`;return}
M.innerHTML=head("Proveedores","Cómo cumple cada proveedor. Sirve para decidir a quién pedir y cuánto margen dar.")+`<div class="card"><table><thead><tr><th>Proveedor</th><th>Tipo</th><th>A tiempo</th><th>Rechazo</th><th>Documentación</th><th>Abiertos</th></tr></thead><tbody>${Object.keys(SUP).map(k=>{const s=SUP[k],c=s.ot<85?"b":s.ot<92?"w":"";return `<tr class="c" onclick="S.sup='${k}';draw()"><td><b>${s.n}</b></td><td>${s.t}</td><td><div style="display:flex;gap:8px;align-items:center"><div class="bar2"><i class="${c}" style="width:${s.ot}%"></i></div>${s.ot} %</div></td><td>${s.rej} %</td><td>${s.doc} %</td><td>${O.filter(o=>o.s==k).length}</td></tr>`}).join("")}</tbody></table></div><div class="src2">Cifras de ejemplo inventadas para la demo.</div>`}
function dr(){if(!S.draft.length){M.innerHTML=head("Borradores","Mensajes a proveedor para revisar. No se envía nada sin aprobarlo.")+`<div class="card empty">Ninguno. Abre una confirmación o un lote con diferencias y pulsa "Preparar mensaje".</div>`;return}
M.innerHTML=head("Borradores","Revisa cada mensaje. En esta demo no se envía nada.")+S.draft.map(d=>{const isR=d[0]=="r",x=isR?R[+d.slice(1)]:O[+d.slice(1)],s=SUP[x.s];return `<div class="card"><div class="m" style="padding:12px 14px 0">Para: ${s.n}${isR?"":" · por "+(x.ch=="WhatsApp"?"WhatsApp":"correo")}</div><div class="draft">${isR?msgR(x):msg(x)}</div><div class="bar"><button class="btn" onclick="S.draft=S.draft.filter(y=>y!='${d}');draw()">Descartar</button><button class="btn p" ${S.sent[d]?"disabled":""} onclick="S.sent['${d}']=1;draw()">${S.sent[d]?"Aprobado (simulado)":"Aprobar y enviar"}</button></div></div>`}).join("")}
draw()
</script></body></html>
