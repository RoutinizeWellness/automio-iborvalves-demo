<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Demo · Compras y certificados · IBOR Valves</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1d2127;--mut:#6b7280;--line:#e3e5e9;--acc:#1f4fd8;--ok:#177245;--warn:#a85d00;--bad:#b3261e}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;min-height:100vh}
nav{width:216px;background:#fff;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;flex:none;display:flex;flex-direction:column}
.brand{padding:2px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}.brand img{max-width:140px;max-height:44px;display:block}.brand small{display:block;color:var(--mut);font-size:11.5px;margin-top:8px}
nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;font:inherit;color:#444b55;cursor:pointer}
nav button:hover{background:#f3f4f6}nav button.on{background:#e8eefc;color:var(--acc);font-weight:600}nav .n{font-size:11px;background:#fdecc8;color:var(--warn);border-radius:99px;padding:0 7px}
.by{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);display:flex;gap:8px;align-items:center}.by img{height:18px}
main{flex:1;padding:22px 26px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}h2{margin:0;font-size:19px}p.sub{color:var(--mut);margin:3px 0 0}
.tag{font-size:11.5px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:auto}
table{width:100%;border-collapse:collapse}th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}th{font-size:11.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;background:#fafbfc;border-top:0}
tbody tr.c{cursor:pointer}tbody tr.c:hover{background:#f7f9ff}td.w{white-space:normal}
.pill{font-size:11.5px;padding:2px 8px;border-radius:4px;background:#eceef1;color:#555;white-space:nowrap;font-weight:500}.pill.ok{background:#e0f2e7;color:var(--ok)}.pill.w{background:#fdecc8;color:var(--warn)}.pill.b{background:#fbe2df;color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}.kpi b{font-size:24px;display:block}.kpi span{color:var(--mut);font-size:12.5px}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.src{padding:14px 16px;font-size:13px;line-height:1.6}.src .h{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:8px}
.cert{border:1px solid #cfd3da;padding:12px 14px;background:#fcfcfd;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
mark{background:#fff0a8;padding:0 2px;border-radius:2px}mark.sel{outline:2px solid var(--acc)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line)}.ck:first-child{border-top:0}.ck .i{width:18px;height:18px;border-radius:50%;flex:none;margin-top:1px;text-align:center;font-size:11px;line-height:18px;color:#fff}.i.ok{background:var(--ok)}.i.b{background:var(--bad)}.i.w{background:var(--warn)}
.ck .m{color:var(--mut);font-size:12.5px}.ck.cl{cursor:pointer}.ck.cl:hover{background:#f7f9ff}
.bar{display:flex;gap:8px;justify-content:flex-end;padding:12px 14px;border-top:1px solid var(--line);background:#fafbfc}
.btn{border:1px solid #cfd3da;background:#fff;padding:7px 13px;border-radius:6px;font:inherit;cursor:pointer}.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}.btn:disabled{opacity:.5;cursor:default}
.back{color:var(--acc);cursor:pointer;display:inline-block;margin-bottom:8px}.empty{padding:22px;color:var(--mut);text-align:center}
.draft{padding:12px 14px;white-space:pre-wrap;font-size:13.5px;border:1px solid var(--line);margin:10px 14px;border-radius:6px;background:#fafbfc}
.m{color:var(--mut);font-size:12.5px}.note{padding:10px 14px;background:#fffaf0;border-top:1px solid var(--line);font-size:12.5px;color:#6b4a00}
@media(max-width:820px){body{display:block}nav{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;gap:4px;padding:10px}.brand{border:0;margin:0;padding:0 8px;width:100%}nav button{width:auto}.by{display:none}.kpis{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}main{padding:16px}}
</style></head><body>
<nav><div class="brand"><img src="logo.png" alt="IBOR Valves"><small>Compras · demo</small></div><div id="nv"></div><div class="by"><img src="automio.svg" alt="Automio"><span>Automio</span></div></nav>
<main id="m"></main>
<script>
// Datos ficticios. Proveedores, pedidos, coladas y cifras inventados para la demo.
const O=[
{po:"OC-24-0318",sup:"Forjados del Vallès (ficticio)",type:"Forja",item:"Cuerpos forjados bola 6\" 300# · A105",qty:40,dReq:"09/12",dConf:"09/12",qConf:40,mat:"A105",matConf:"A105",cert:"3.1 recibido",doc:"ok",ch:"Correo",when:"hoy 08:12",st:"ok",srcTxt:"Confirmamos 40 cuerpos forjados 6\" 300# en A105, entrega 09/12. Se adjunta certificado 3.1 de la colada 7731."},
{po:"OC-24-0322",sup:"Aceros Inox Bages (ficticio)",type:"Barra inox",item:"Barra redonda Ø60 · AISI 316L (bolas y vástagos)",qty:120,dReq:"02/12",dConf:"11/12",qConf:120,mat:"316L",matConf:"316L",cert:"3.1 recibido",doc:"ok",ch:"WhatsApp",when:"ayer 17:40",st:"d",srcTxt:"Os confirmo las 120 barras 316L. Con el material de fábrica llegan el 11/12, no antes."},
{po:"OC-24-0325",sup:"Mecanizados Can Carner (ficticio)",type:"Mecanizado",item:"Mecanizado de asientos y tapas · serie 150#",qty:200,dReq:"05/12",dConf:"05/12",qConf:160,mat:"—",matConf:"—",cert:"No aplica",doc:"ok",ch:"Correo",when:"hoy 09:30",st:"q",srcTxt:"Entregamos 160 piezas el 05/12 y las 40 restantes la semana siguiente por una avería en el centro de mecanizado."},
{po:"OC-24-0329",sup:"Fundición Ripollès (ficticio)",type:"Fundición",item:"Tapas fundidas CF8M · 4\" 150#",qty:60,dReq:"10/12",dConf:"10/12",qConf:60,mat:"CF8M",matConf:"CF3M",cert:"3.1 recibido",doc:"b",ch:"PDF adjunto",when:"hoy 10:05",st:"m",srcTxt:"Confirmación de pedido. 60 tapas 4\" 150#. Material: CF3M. Entrega 10/12. Certificado 3.1 colada C-2290."},
{po:"OC-24-0331",sup:"Tratamientos Térmicos Sabadell (ficticio)",type:"Tratamiento",item:"Temple y revenido de vástagos · lote 14",qty:300,dReq:"03/12",dConf:"03/12",qConf:300,mat:"—",matConf:"—",cert:"Pendiente",doc:"w",ch:"Correo",when:"ayer 12:20",st:"c",srcTxt:"Lote 14 confirmado para el 03/12. El informe de tratamiento se envía con el albarán."},
{po:"OC-24-0334",sup:"Juntas y Retenes Terrassa (ficticio)",type:"Juntas",item:"Juegos de juntas PTFE y grafito · 2\"–8\"",qty:500,dReq:"28/11",dConf:"28/11",qConf:500,mat:"—",matConf:"—",cert:"No aplica",doc:"ok",ch:"Correo",when:"hace 3 días",st:"ok",srcTxt:"Confirmado tal cual el pedido. Salida de almacén el 27/11."}
];
O.forEach(o=>{o.done=false});
const lab={ok:"Coincide",d:"Fecha distinta",q:"Cantidad distinta",m:"Material distinto",c:"Falta certificado"};
const pc={ok:"ok",d:"w",q:"w",m:"b",c:"w"};
let S={v:"home",open:null,f:"Todos",draft:[],sent:{}};
const $=s=>document.querySelector(s),M=$("#m");
const pend=()=>O.filter(o=>o.st!="ok"&&!o.done);
const V=[["home","Resumen"],["conf","Confirmaciones",()=>pend().length],["ord","Pedidos de compra"],["sup","Proveedores"],["dr","Borradores",()=>S.draft.length]];
function nav(v,x){S.v=v;S.open=x==null?null:x;draw()}
function draw(){$("#nv").innerHTML=V.map(([k,l,f])=>`<button class="${S.v==k?"on":""}" onclick="nav('${k}')">${l}${f&&f()?`<span class="n">${f()}</span>`:""}</button>`).join("");({home,conf,ord,sup,dr})[S.v]();window.scrollTo(0,0)}
const pill=o=>o.done?'<span class="pill ok">Revisado</span>':`<span class="pill ${pc[o.st]}">${lab[o.st]}</span>`;
function checks(o){const r=[];
r.push([o.dConf==o.dReq?"ok":"w","Fecha de entrega",`Pedida ${o.dReq} · confirmada ${o.dConf}`]);
r.push([o.qConf==o.qty?"ok":"w","Cantidad",`Pedida ${o.qty} · confirmada ${o.qConf}`]);
if(o.mat!="—")r.push([o.mat==o.matConf?"ok":"b","Material",`Pedido ${o.mat} · confirmado ${o.matConf}`+(o.mat!=o.matConf?" (no es el mismo grado)":"")]);
if(o.cert!="No aplica")r.push([o.cert=="Pendiente"?"w":"ok","Certificado EN 10204",o.cert=="Pendiente"?"Aún no recibido. Se pide antes de dar entrada":"3.1 recibido y con colada legible"]);
return r}
function home(){const p=pend();M.innerHTML=`<div class="top"><div><h2>Compras · IBOR Valves</h2><p class="sub">Confirmaciones de proveedores comparadas con el pedido, y certificados de material por revisar.</p></div><span class="tag">Datos ficticios</span></div>
<div class="kpis"><div class="kpi"><b>${O.length}</b><span>pedidos abiertos</span></div><div class="kpi"><b>${p.length}</b><span>confirmaciones por revisar</span></div><div class="kpi"><b>${O.filter(o=>o.st=="m"&&!o.done).length}</b><span>material distinto al pedido</span></div><div class="kpi"><b>${O.filter(o=>o.st=="c"&&!o.done).length}</b><span>certificados pendientes</span></div></div>
<div class="card"><table><thead><tr><th>Pedido</th><th>Proveedor</th><th>Qué pasa</th><th></th></tr></thead><tbody>${p.length?p.map(o=>`<tr class="c" onclick="nav('conf',${O.indexOf(o)})"><td><b>${o.po}</b></td><td>${o.sup}</td><td>${checks(o).filter(c=>c[0]!="ok").map(c=>c[1]).join(", ")}</td><td>${pill(o)}</td></tr>`).join(""):'<tr><td colspan="4" class="empty">Todo revisado.</td></tr>'}</tbody></table></div>
<p class="m">Lo que se ve aquí sale de correos, WhatsApp y PDF de confirmación. Nada se envía ni se cambia sin tu aprobación.</p>`}
function conf(){if(S.open!=null)return rev(S.open);const fs=["Todos","Con diferencias","Sin diferencias"];let L=O.filter(o=>S.f=="Todos"||(S.f=="Con diferencias")==(o.st!="ok"));
M.innerHTML=`<div class="top"><div><h2>Confirmaciones</h2><p class="sub">Cada confirmación se lee y se compara con el pedido de compra.</p></div></div><div class="chips">${fs.map(f=>`<span class="chip ${S.f==f?"on":""}" onclick="S.f='${f}';draw()">${f}</span>`).join("")}</div>
<div class="card"><table><thead><tr><th>Pedido</th><th>Proveedor</th><th>Tipo</th><th>Canal</th><th>Recibida</th><th>Estado</th></tr></thead><tbody>${L.map(o=>`<tr class="c" onclick="nav('conf',${O.indexOf(o)})"><td><b>${o.po}</b></td><td>${o.sup}</td><td>${o.type}</td><td>${o.ch}</td><td>${o.when}</td><td>${pill(o)}</td></tr>`).join("")}</tbody></table></div>`}
function srcHtml(o){const t=o.srcTxt;if(o.ch=="WhatsApp")return `<div class="h">WhatsApp · ${o.sup} · ${o.when}</div><div style="background:#e7f4de;border-radius:8px;padding:8px 10px;max-width:92%"><mark>${t}</mark></div>`;
if(o.ch.includes("PDF"))return `<div class="h">PDF adjunto · confirmacion_${o.po}.pdf</div><div class="cert"><b>CONFIRMACIÓN DE PEDIDO</b><br>Ref. cliente: ${o.po}<br><br><mark>${t}</mark><br><br><span class="m">Documento simulado para la demo.</span></div>`;
return `<div class="h">Correo · ${o.sup} · ${o.when}</div>Asunto: Re: Pedido ${o.po}<br><br><mark>${t}</mark>`}
function rev(i){const o=O[i],c=checks(o);M.innerHTML=`<span class="back" onclick="nav('conf')">← Confirmaciones</span><div class="top"><div><h2>${o.po} · ${o.sup}</h2><p class="sub">${o.item} · ${o.qty} uds</p></div>${pill(o)}</div>
<div class="split"><div class="card src">${srcHtml(o)}</div><div class="card">${c.map(x=>`<div class="ck"><span class="i ${x[0]}">${x[0]=="ok"?"✓":"!"}</span><div><b>${x[1]}</b><div class="m">${x[2]}</div></div></div>`).join("")}${o.st=="m"?'<div class="note">El material confirmado no es el pedido. No se da entrada hasta aclararlo con el proveedor.</div>':""}
<div class="bar"><button class="btn" onclick="nav('conf')">Dejar para luego</button>${o.st!="ok"?`<button class="btn" onclick="mk(${i})">Preparar mensaje</button>`:""}<button class="btn p" onclick="O[${i}].done=true;nav('conf')">Marcar revisado</button></div></div></div>`}
function mk(i){if(!S.draft.includes(i))S.draft.push(i);nav("dr")}
function msg(o){const c=checks(o).filter(x=>x[0]!="ok");const t={m:`el material confirmado (${o.matConf}) no coincide con el pedido (${o.mat}). Necesitamos confirmar por escrito si podéis suministrar ${o.mat} en la fecha pedida, con certificado 3.1.`,d:`la fecha confirmada (${o.dConf}) es posterior a la pedida (${o.dReq}). ¿Podéis adelantar alguna parte? Si no, confirmadnos la fecha definitiva.`,q:`confirmáis ${o.qConf} de ${o.qty} unidades. ¿Qué día llegan las ${o.qty-o.qConf} restantes?`,c:`falta el certificado EN 10204 3.1. Lo necesitamos antes de dar entrada al material.`}[o.st];return `Hola,\n\nSobre el pedido ${o.po} (${o.item}): ${t}\n\nGracias.\nCompras · IBOR Valves`}
function ord(){M.innerHTML=`<div class="top"><div><h2>Pedidos de compra</h2><p class="sub">Pedidos abiertos y resultado de la comparación.</p></div></div><div class="card"><table><thead><tr><th>Pedido</th><th>Proveedor</th><th>Artículo</th><th>Cant.</th><th>Entrega pedida</th><th>Confirmada</th><th>Estado</th></tr></thead><tbody>${O.map((o,i)=>`<tr class="c" onclick="nav('conf',${i})"><td><b>${o.po}</b></td><td>${o.sup}</td><td>${o.item}</td><td>${o.qty}</td><td>${o.dReq}</td><td>${o.dConf}</td><td>${pill(o)}</td></tr>`).join("")}</tbody></table></div>`}
function sup(){const n=[...new Set(O.map(o=>o.sup))];M.innerHTML=`<div class="top"><div><h2>Proveedores</h2><p class="sub">Cuántas confirmaciones de cada proveedor no coinciden con el pedido.</p></div></div><div class="card"><table><thead><tr><th>Proveedor</th><th>Tipo</th><th>Pedidos abiertos</th><th>Con diferencias</th></tr></thead><tbody>${n.map(s=>{const L=O.filter(o=>o.sup==s);return `<tr><td><b>${s}</b></td><td>${L[0].type}</td><td>${L.length}</td><td>${L.filter(o=>o.st!="ok").length}</td></tr>`}).join("")}</tbody></table></div>`}
function dr(){if(!S.draft.length){M.innerHTML=`<div class="top"><div><h2>Borradores</h2><p class="sub">Mensajes a proveedor para que los revises. No se envía nada sin aprobarlo.</p></div></div><div class="card empty">Ninguno. Abre una confirmación con diferencias y pulsa "Preparar mensaje".</div>`;return}
M.innerHTML=`<div class="top"><div><h2>Borradores</h2><p class="sub">Revisa cada mensaje. En esta demo no se envía nada.</p></div></div>${S.draft.map(i=>{const o=O[i];return `<div class="card"><div class="m" style="padding:12px 14px 0">Para: ${o.sup} · por ${o.ch=="WhatsApp"?"WhatsApp":"correo"}</div><div class="draft">${msg(o)}</div><div class="bar"><button class="btn" onclick="S.draft=S.draft.filter(x=>x!=${i});draw()">Descartar</button><button class="btn p" ${S.sent[i]?"disabled":""} onclick="S.sent[${i}]=1;draw()">${S.sent[i]?"Aprobado (simulado)":"Aprobar y enviar"}</button></div></div>`}).join("")}`}
draw()
</script></body></html>
